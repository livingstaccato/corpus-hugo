baseURL = "/"
title = "Corpus Theme — Example"
theme = "corpus-hugo"
themesDir = "../.."

[markup.goldmark.renderer]
  unsafe = true

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']

[outputFormats.searchindex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "searchindex"]

[params]
  description = "A tokenized, light/dark Hugo theme for a knowledge base or docs site — this page is itself built with it."
  knowledge_id = "example"
  # This corpus is served at the hub's own root (no /guides-hub/-style
  # subpath), so knowledge_hub_root is "/" instead of the "/knowledge/"
  # default, and this id is the one that collapses to no subpath in
  # x-kb: links and the hub manifest below.
  knowledge_hub_root = "/"
  knowledge_hub_root_id = "example"
  tagline = "Corpus"
  search_enabled = true
  cta_url = "/docs/getting-started/"
  cta_label = "Read the docs"
  copyrightHolder = "Corpus"
  github = "https://github.com/livingstaccato/corpus-hugo"

[[menu.main]]
  name = "Docs"
  url = "/docs/"
  weight = 1

[[menu.main]]
  name = "Guides"
  url = "/guides/"
  weight = 2
